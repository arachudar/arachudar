[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -ra --strict-markers
markers =
    tier1: Tier 1 individual feature isolation tests (>=70 tests)
    tier2: Tier 2 boundary, negative, and corner-case tests (>=70 tests)
    tier3: Tier 3 pairwise cross-feature interaction tests (>=14 tests)
    tier4: Tier 4 end-to-end real-world workload scenarios (>=7 tests)
    hermetic: Tests running with zero external network access (default)
    live_network: Optional tests making real external network calls (requires --run-live)
    slow: Tests requiring extended execution time (> 2.0s)
filterwarnings =
    ignore::DeprecationWarning
    ignore::ResourceWarning
